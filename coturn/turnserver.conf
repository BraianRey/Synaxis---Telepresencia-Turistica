# /etc/turnserver.conf
# Coturn server configuration for Synexis Telepresencia Turistica

# Standard STUN and TURN listening ports
listening-port=3478
alt-listening-port=3479

# TURN over TLS (TURNS) listening ports
tls-listening-port=5349
alt-tls-listening-port=5350

# Bind to all network interfaces
listening-ip=0.0.0.0

# Verbose logging for development debugging
verbose

# Time-Windowed REST API authentication configuration
use-auth-secret
static-auth-secret=synexissupersecretkey2026
realm=synexis.com

# Disable Nagle's algorithm to reduce TCP latency
tcp-nodelay

# Dynamic media relay port range (narrowed for Docker Desktop mapping)
min-port=50000
max-port=50100

# Security: disable CLI and database-backed TLS
no-cli
no-tls-db
no-multicast-loopback
