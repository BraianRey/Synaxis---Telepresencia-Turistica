spring:
  application:
    name: management-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tourpresence}
    username: ${SPRING_DATASOURCE_USERNAME:synexis}
    password: ${SPRING_DATASOURCE_PASSWORD:synexis123}
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: never

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8085/realms/synexis}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jackson:
    time_zone: UTC
    serialization:
      write-empty-json-arrays: true

server:
  port: ${PORT:8080}

keycloak:
  realm: ${KEYCLOAK_REALM:synexis}
  server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8085}
  client-id: ${KEYCLOAK_CLIENT_ID:telepresence}
  client-secret: ${KEYCLOAK_CLIENT_SECRET:wO8qciPyigPvlYPQAX3wzft18wa1lqv6}